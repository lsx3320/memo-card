<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0b" />
<title>相册 · Gallery</title>
<meta name="description" content="便签卡片站点的相册页：界面截图收藏，支持分类筛选、搜索与灯箱浏览。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./album.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/dist/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="8.5" cy="10" r="1.6"/>
            <path d="M21 16l-4.5-4.5L9 19"/>
          </svg>
        </span>
        <span class="brand-text">相册<em>Gallery</em></span>
      </a>

      <nav class="filters" id="filters" aria-label="相册分类"></nav>

      <label class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/>
        </svg>
        <input id="search" type="search" placeholder="搜索标题 / 标签" autocomplete="off" aria-label="搜索照片" />
      </label>
    </div>
  </header>

  <section class="hero wrap">
    <p class="eyebrow">LIGHT &amp; SIGNAL</p>
    <h1>光与信号的收藏夹</h1>
    <p class="lede">这个站点成长过程中留下的界面切片——账户、看板、部署、提交记录，
      每一张都是一次真实的运行状态。点开任意一张进入灯箱，支持 ← → 翻页。</p>
    <div class="stats" id="stats"></div>
  </section>

  <main class="wrap">
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>没有匹配的照片，换个关键词试试。</p>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span>相册 · 测试页面</span>
      <span class="dot">·</span>
      <a href="/dist/">返回应用</a>
      <span class="dot">·</span>
      <a href="https://github.com/lsx3320/memo-card" target="_blank" rel="noopener">GitHub</a>
    </div>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="照片查看器" hidden>
    <button class="lb-close" id="lbClose" aria-label="关闭">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="lb-nav prev" id="lbPrev" aria-label="上一张">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="lb-nav next" id="lbNext" aria-label="下一张">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg>
    </button>

    <figure class="lb-stage">
      <img id="lbImg" alt="" />
      <figcaption class="lb-caption">
        <div class="lb-meta">
          <h2 id="lbTitle"></h2>
          <p id="lbDesc"></p>
        </div>
        <div class="lb-side">
          <span class="lb-counter" id="lbCounter">1 / 8</span>
          <a class="lb-download" id="lbDownload" href="#" download>下载原图</a>
        </div>
      </figcaption>
    </figure>
  </div>

  <script src="./album.js"></script>
</body>
</html>
