<main>

      <div class="gallery-grid" id="gGrid"></div>
    </div>
  </section>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="照片查看器" hidden>
    <button class="lb-close" id="lbClose" type="button" aria-label="关闭">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>

    <button class="lb-nav next" id="lbNext" type="button" aria-label="下一张">

    </button>
    <div>
      <img id="lbImg" alt="" />
      <p class="lb-cap" id="lbCap"></p>
